name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup Node.js (for Web Dashboard Assets)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm & Build Dashboard Assets
        run: |
          npm install -g pnpm
          cd clients/web
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
          cd ../..
          mkdir -p crates/automemory-cli/src/dashboard/assets
          cp -rf clients/web/dist/* crates/automemory-cli/src/dashboard/assets/
        shell: bash

      - name: Build Binary (Cargo)
        run: cargo build --release --target ${{ matrix.target }}
        shell: bash

      - name: Package Binary (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/automemory"
          ARCHIVE_NAME="automemory-${{ matrix.target }}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" -C "target/${{ matrix.target }}/release" automemory
          shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          echo "ARCHIVE_PATH=${ARCHIVE_NAME}" >> $GITHUB_ENV
          echo "CHECKSUM_PATH=${ARCHIVE_NAME}.sha256" >> $GITHUB_ENV
        shell: bash

      - name: Package Binary (Windows)
        if: matrix.archive == 'zip'
        run: |
          $target = "${{ matrix.target }}"
          $archive = "automemory-$target.zip"
          Compress-Archive -Path "target/$target/release/automemory.exe" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "$archive.sha256" -Encoding ascii
          echo "ARCHIVE_PATH=$archive" >> $env:GITHUB_ENV
          echo "CHECKSUM_PATH=$archive.sha256" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: automemory-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.CHECKSUM_PATH }}

  publish-release:
    name: Publish GitHub Release
    needs: [build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Display Downloaded Artifacts
        run: ls -la dist/

      - name: Create GitHub Release in Public Distribution Repo
        uses: softprops/action-gh-release@v2
        with:
          repository: theasmat/automemory-bin
          token: ${{ secrets.GH_PAT || github.token }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: AutoMemory ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Sync Installer Scripts to Distribution Repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${GH_TOKEN}@github.com/theasmat/automemory-bin.git dist_repo
          cp install.sh dist_repo/install.sh
          cp install.ps1 dist_repo/install.ps1
          cd dist_repo
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: sync installers for ${{ inputs.tag || github.ref_name }}"
            git push origin master
            git push origin master:main || true
          fi
